[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numaudit"
version = "0.1.0"
description = "Check that every number written in a document appears in the data it came from."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tsuruta Lab" }]
keywords = ["documentation", "reproducibility", "data", "fact-checking", "markdown", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tsurutanmen/numaudit"
Issues = "https://github.com/tsurutanmen/numaudit/issues"

[project.scripts]
numaudit = "numaudit.cli:main"

[tool.setuptools.packages.find]
include = ["numaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
